<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error - Something Went Wrong</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <style>
    :root {
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #1b2330;
      --text-muted: #6b7587;
      --primary: #1d5fd1;
      --primary-hover: #1747a6;
      --primary-light: #f0f5fd;
      --danger: #c93b3b;
      --danger-light: #f8d9d9;
      --border-color: #e1e5eb;
      --code-bg: #f1f3f7;
      --shadow: 0 10px 30px rgba(11, 42, 91, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 540px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    .error-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1d5fd1, #3b7bea, #c93b3b);
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background-color: var(--danger-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      animation: bounce 1.2s ease infinite alternate;
    }

    .icon-container svg {
      width: 42px;
      height: 42px;
      stroke-width: 2.2;
    }

    .error-badge {
      display: inline-block;
      font-size: 0.825rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      background-color: var(--primary-light);
      color: var(--primary);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p.description {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.925rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--code-bg);
      transform: translateY(-1px);
    }

    .details-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .details-toggle:hover {
      color: var(--text-main);
    }

    .error-details {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background-color: var(--code-bg);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #374151;
      text-align: left;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .error-details.open {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-note a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-4px);
      }
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 32px 20px;
      }
      .actions {
        flex-direction: column;
        width: 100%;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <!-- Icon -->
    <div class="icon-container" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 7.5h.008v.008H12v-.008z" />
      </svg>
    </div>

    <!-- Error Status Badge -->
    <span class="error-badge" id="error-code">Error 404</span>

    <!-- Heading -->
    <h1 id="error-title">Page Not Found</h1>

    <!-- Description -->
    <p class="description" id="error-message">
      The page or resource you are looking for doesn't exist, has been moved, or is temporarily unavailable.
    </p>

    <!-- Call to actions -->
    <div class="actions">
      <button class="btn btn-primary" onclick="window.history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Go Back
      </button>

      <a href="/" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home Page
      </a>

      <button class="btn btn-secondary" onclick="window.location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Retry
      </button>
    </div>

    <!-- Collapsible Technical Details (Useful for debugging) -->
    <div>
      <button class="details-toggle" type="button" onclick="toggleDetails()">
        <span>Technical details</span>
        <svg id="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div id="error-details" class="error-details">
        <div><strong>Status:</strong> HTTP 404 Not Found</div>
        <div><strong>Timestamp:</strong> <span id="timestamp"></span></div>
        <div><strong>Path:</strong> <span id="current-url"></span></div>
      </div>
    </div>

    <div class="footer-note">
      Need assistance? Contact <a href="mailto:support@lasustech.edu.ng">ICT Support</a>
    </div>
  </div>

  <script>
    // Populate dynamic debugging values
    document.getElementById("timestamp").textContent = new Date().toISOString();
    document.getElementById("current-url").textContent = window.location.pathname || "/";

    function toggleDetails() {
      const details = document.getElementById("error-details");
      const chevron = document.getElementById("chevron-icon");
      const isOpen = details.classList.toggle("open");
      chevron.style.transform = isOpen ? "rotate(180deg)" : "rotate(0deg)";
    }
  </script>
</body>
</html>
